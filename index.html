<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xero — Brand Guidelines</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header" id="site-header">
  <div class="header-inner">
    <div class="brand">
      <a href="#" class="logo" aria-label="Xero — home">
        <img src="assets/img/xero-wordmark-logo.svg" alt="Xero" class="logo-mark" />
      </a>
      <span class="brand-subtitle">Brand Guidelines</span>
    </div>

    <nav class="nav" aria-label="Primary">
      <ul>
        <li class="nav-item">
          <a href="#" class="nav-link" aria-expanded="false" aria-controls="mega-panel">
            <span>Principles</span>
            <span class="nav-chevron" aria-hidden="true">
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none">
                <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" aria-expanded="false" aria-controls="mega-panel">
            <span>Expression</span>
            <span class="nav-chevron" aria-hidden="true">
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none">
                <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link" aria-expanded="false" aria-controls="mega-panel">
            <span>Resources</span>
            <span class="nav-chevron" aria-hidden="true">
              <svg width="10" height="6" viewBox="0 0 10 6" fill="none">
                <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>
        </li>
      </ul>
    </nav>

    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="mobile-overlay">
      <span class="menu-toggle-label">menu</span>
      <span class="menu-toggle-icon" aria-hidden="true"></span>
    </button>
  </div>
</header>

<div class="mega-panel" id="mega-panel">
  <a href="#" class="mega-row" data-scramble="Brand Archetype">Brand Archetype</a>
  <a href="#" class="mega-row" data-scramble="Brand Attributes">Brand Attributes</a>
  <a href="#" class="mega-row" data-scramble="Brand Values">Brand Values</a>
</div>

<div class="mobile-overlay" id="mobile-overlay">
  <nav aria-label="Primary mobile">
    <ul>
      <li><a href="#" class="mobile-link">Principles</a></li>
      <li><a href="#" class="mobile-link">Expression</a></li>
      <li><a href="#" class="mobile-link">Resources</a></li>
    </ul>
  </nav>
</div>

<main>
  <section class="grid-section" id="grid-host" aria-label="Image grid"></section>
</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/infinite-grid.js"></script>
</body>
</html>
