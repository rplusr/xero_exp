<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio — Generative Sheets</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">Studio</div>
      <div class="topbar-actions">
        <label class="seed-field">
          <span>Seed</span>
          <input type="text" id="seedInput" value="1" spellcheck="false" />
        </label>
        <button class="btn" id="randomiseBtn" title="Randomise (R)">Randomise</button>
        <div class="divider"></div>
        <button class="btn" id="exportSvgBtn">Export SVG</button>
        <button class="btn btn-primary" id="exportPngBtn">Export PNG</button>
      </div>
    </header>

    <main class="workspace">
      <section class="canvas-pane">
        <div class="canvas-frame">
          <svg id="canvas" viewBox="0 0 960 640" width="960" height="640"></svg>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-section">
          <h2>Ribbon</h2>
          <div id="ribbonControls"></div>
        </div>

        <div class="panel-section">
          <div class="section-head">
            <h2>Zones</h2>
            <button class="icon-btn" id="addZoneBtn" title="Add zone (A)">+</button>
          </div>
          <ul class="layer-list" id="zoneList"></ul>
        </div>

        <div id="zoneControls"></div>
      </aside>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
