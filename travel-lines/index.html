<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Travel Lines — generative transit diagrams</title>
<meta name="description" content="A generative tool for subway-map-style geometric line art." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23D1112E'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <svg id="canvas" class="tl-svg" role="img" aria-label="Generative travel line composition"></svg>

    <div class="stage-topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Travel&nbsp;Lines</h1>
      </div>
      <button type="button" id="panelToggle" class="icon-btn panel-toggle" aria-label="Toggle controls" aria-expanded="false" aria-controls="panel">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </main>

  <div class="panel-backdrop" id="panelBackdrop"></div>

  <aside class="panel" id="panel" aria-label="Composition controls">
    <div class="panel-inner">

      <section class="panel-section seed-section">
        <button type="button" id="randomizeBtn" class="btn btn-primary">Randomise</button>
        <div class="seed-row">
          <label for="seedInput" class="sr-only">Seed</label>
          <input id="seedInput" type="text" class="seed-input" spellcheck="false" autocomplete="off" aria-label="Seed" />
          <button type="button" id="copySeedBtn" class="icon-btn copy-btn" aria-label="Copy seed to clipboard" title="Copy seed">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
              <rect x="5.25" y="5.25" width="7.5" height="7.5" rx="1.25" stroke="currentColor" stroke-width="1.2" />
              <path d="M2.25 9.75V3.5A1.25 1.25 0 0 1 3.5 2.25h6.25" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </section>

      <section class="panel-section">
        <h2>Composition</h2>
        <div class="control">
          <label for="lineCount">Number of lines <span class="value" id="lineCountValue">7</span></label>
          <input id="lineCount" type="range" min="2" max="16" step="1" value="7" />
        </div>
        <div class="control">
          <label for="gridDensity">Grid density <span class="value" id="gridDensityValue">5</span></label>
          <input id="gridDensity" type="range" min="1" max="10" step="1" value="5" />
        </div>
      </section>

      <section class="panel-section">
        <h2>Line style</h2>
        <div class="control">
          <label for="thickness">Thickness <span class="value" id="thicknessValue">7</span></label>
          <input id="thickness" type="range" min="2" max="16" step="0.5" value="7" />
        </div>
        <div class="control">
          <label for="cornerRadius">Corner radius <span class="value" id="cornerRadiusValue">16</span></label>
          <input id="cornerRadius" type="range" min="2" max="34" step="1" value="16" />
        </div>
        <div class="control">
          <label for="spacing">Bundle spacing <span class="value" id="spacingValue">11</span></label>
          <input id="spacing" type="range" min="3" max="26" step="1" value="11" />
        </div>
      </section>

      <section class="panel-section">
        <h2>Palette</h2>
        <div class="swatch-row" id="paletteRow" role="radiogroup" aria-label="Colour palette"></div>
        <div class="custom-colors" id="customColors" hidden>
          <input type="color" id="customColor1" value="#D1112E" aria-label="Custom colour 1" />
          <input type="color" id="customColor2" value="#0E7C61" aria-label="Custom colour 2" />
          <input type="color" id="customColor3" value="#2A2A2A" aria-label="Custom colour 3" />
        </div>
      </section>

      <section class="panel-section">
        <h2>Canvas</h2>
        <div class="segmented" id="bgSegmented" role="radiogroup" aria-label="Background">
          <button type="button" data-bg="light" class="segmented-btn is-active">Light</button>
          <button type="button" data-bg="dark" class="segmented-btn">Dark</button>
        </div>
        <div class="switch-row">
          <label class="switch-label" for="stationsToggle">Station nodes</label>
          <input type="checkbox" id="stationsToggle" class="switch" checked />
        </div>
        <div class="switch-row">
          <label class="switch-label" for="animationToggle">Animation</label>
          <input type="checkbox" id="animationToggle" class="switch" checked />
        </div>
      </section>

      <section class="panel-section export-section">
        <h2>Export</h2>
        <div class="btn-row">
          <button type="button" id="exportSvgBtn" class="btn btn-secondary">SVG</button>
          <button type="button" id="exportPngBtn" class="btn btn-secondary">PNG · 2×</button>
        </div>
      </section>

    </div>
  </aside>
</div>

<script type="module" src="dist/main.js"></script>
</body>
</html>
